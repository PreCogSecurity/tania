# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # PHP dependencies (Composer)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "php"
      - "composer"
    commit-message:
      prefix: "chore(composer)"
      include: "scope"
    reviewers:
      - "PrecogSecurity/team-maintainers"
    assignees:
      - "precog-bot"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for Symfony 3.x (requires code changes)
      - dependency-name: "symfony/*"
        update-type: "version-update:semver-major"
      # Ignore major version updates for Doctrine (requires code changes)
      - dependency-name: "doctrine/*"
        update-type: "version-update:semver-major"

  # JavaScript dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "javascript"
      - "npm"
    commit-message:
      prefix: "chore(npm)"
      include: "scope"
    reviewers:
      - "PrecogSecurity/team-maintainers"
    assignees:
      - "precog-bot"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for ESLint config (may require config changes)
      - dependency-name: "eslint-config-airbnb-base"
        update-type: "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(github-actions)"
      include: "scope"
    reviewers:
      - "PrecogSecurity/team-maintainers"
    open-pull-requests-limit: 5