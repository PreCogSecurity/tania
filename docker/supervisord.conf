[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.d/www.conf
user=tania
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/app/var/logs/php-fpm_out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/var/logs/php-fpm_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/app/var/logs/nginx_out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/var/logs/nginx_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5