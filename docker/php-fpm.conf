; Tania PHP-FPM Configuration
[www]
user = tania
group = tania

listen = 9000
listen.owner = tania
listen.group = tania
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Logging
access.log = /app/var/logs/php-fpm_access.log
slowlog = /app/var/logs/php-fpm_slow.log
request_slowlog_timeout = 10s

; Security
security.limit_extensions = .php

; Environment
env[SYMFONY_ENV] = prod
env[PATH] = /usr/local/bin:/usr/bin:/bin